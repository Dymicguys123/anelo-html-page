name: ChatGPT Instagram ZIPs

on:
  push:
    branches:
      - chatgpt-instagram-zips-20260901

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download all carousel images via public embed proxy
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/igdl
          mkdir -p "$ROOT/out"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'

          for CODE in DaiEngdEzHS Da5HTzEE-4c DbIStACE3l9; do
            DIR="$ROOT/out/$CODE"
            mkdir -p "$DIR"
            echo "Fetching $CODE"
            curl -fsSL --connect-timeout 15 --max-time 55 --retry 2 --retry-delay 2 \
              -A "$UA" "https://www.vxinstagram.com/p/$CODE/" -o "$DIR/page.html"

            python3 - "$DIR/page.html" "$DIR/source_urls.txt" <<'PY'
          import sys
          from html.parser import HTMLParser
          from pathlib import Path

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.urls=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'img':
                      return
                  a=dict(attrs)
                  if a.get('alt') == 'Instagram post' and a.get('src'):
                      self.urls.append(a['src'])

          src=Path(sys.argv[1]).read_text(encoding='utf-8', errors='ignore')
          p=P(); p.feed(src)
          # preserve order and remove duplicates
          seen=set(); urls=[]
          for u in p.urls:
              if u not in seen:
                  seen.add(u); urls.append(u)
          if not urls:
              raise SystemExit('No carousel image URLs found')
          Path(sys.argv[2]).write_text('\n'.join(urls)+'\n', encoding='utf-8')
          print(f'Found {len(urls)} images')
          PY

            N=0
            while IFS= read -r URL; do
              N=$((N+1))
              TMP="$DIR/.img-$N"
              curl -fsSL --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 2 \
                -A "$UA" -H 'Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8' \
                "$URL" -o "$TMP"
              MIME=$(file -b --mime-type "$TMP")
              case "$MIME" in
                image/jpeg) EXT=jpg ;;
                image/png) EXT=png ;;
                image/webp) EXT=webp ;;
                image/avif) EXT=avif ;;
                image/gif) EXT=gif ;;
                *) echo "Unexpected MIME $MIME for $URL"; exit 1 ;;
              esac
              printf -v FN '%02d.%s' "$N" "$EXT"
              mv "$TMP" "$DIR/$FN"
              echo "$CODE $FN $(stat -c%s "$DIR/$FN") bytes $MIME"
            done < "$DIR/source_urls.txt"

            rm -f "$DIR/page.html"
            printf 'Instagram post: https://www.instagram.com/p/%s/\nImages downloaded: %s\n' "$CODE" "$N" > "$DIR/README.txt"
          done

      - name: Create individual ZIP files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/igdl/out
          zip -qr ../DaiEngdEzHS.zip DaiEngdEzHS
          zip -qr ../Da5HTzEE-4c.zip Da5HTzEE-4c
          zip -qr ../DbIStACE3l9.zip DbIStACE3l9
          ls -lh ../*.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: instagram-zips
          path: /tmp/igdl/*.zip
          if-no-files-found: error
          retention-days: 1
